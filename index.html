<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>먹이그물 탐험대</title>
<style>
:root{
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
  --bg:#fff4e6;--bg2:#e8f7ee;--card:#ffffff;--ink:#4a4036;--sub:#8a7d70;--line:#c9bfb3;
  --hi:#ff8a3d;--up:#4cc38a;--down:#ef6b6b;--gone:#a9a29a;--soft:#fff9f0;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){--bg:#2a2530;--bg2:#22303a;--card:#383240;--ink:#f6ece0;--sub:#c3b8aa;--line:#6d6577;--soft:#433c4b}
}
:root[data-theme="dark"]{--bg:#2a2530;--bg2:#22303a;--card:#383240;--ink:#f6ece0;--sub:#c3b8aa;--line:#6d6577;--soft:#433c4b}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;font-family:"Jua","Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif;color:var(--ink);
  background:linear-gradient(160deg,var(--bg),var(--bg2));min-height:100vh;padding:16px}
.wrap{max-width:980px;margin:0 auto}
h1{margin:0 0 4px;font-size:clamp(22px,4vw,32px)}
.lead{margin:0 0 12px;color:var(--sub);font-size:15px}
.graph{background:var(--card);border-radius:24px;padding:8px;box-shadow:0 6px 0 rgba(0,0,0,.06)}
svg{width:100%;height:auto;display:block}
.node{cursor:pointer;transition:opacity .3s}
.node circle.body{stroke-width:5;transition:stroke .3s}
.node:hover circle.body{filter:brightness(1.06)}
.node .lbl{font-size:17px;font-weight:700;fill:var(--ink);text-anchor:middle}
.node .emo{font-size:36px;text-anchor:middle;dominant-baseline:central}
.node .badge{font-size:20px;font-weight:700;text-anchor:middle}
.dim{opacity:.22}
.edge{stroke:var(--edge);stroke-width:2.5;fill:none;transition:all .3s}
.edge.on{stroke:var(--hi);stroke-width:4.5;stroke-dasharray:10 7;animation:flow .8s linear infinite}
.edge.dead{stroke-dasharray:3 6;opacity:.35}
@keyframes flow{to{stroke-dashoffset:-17}}
.legend{display:flex;gap:14px;flex-wrap:wrap;padding:6px 14px 10px;font-size:13px;color:var(--sub)}
.grid{display:grid;grid-template-columns:1.1fr 1fr;gap:14px;margin-top:14px}
@media(max-width:760px){.grid{grid-template-columns:1fr}}
.box{background:var(--card);border-radius:22px;padding:16px;box-shadow:0 5px 0 rgba(0,0,0,.06)}
.box h2{margin:0 0 8px;font-size:19px}
.big{font-size:54px;line-height:1}
.pill{display:inline-block;padding:2px 10px;border-radius:99px;background:var(--soft);font-size:13px;margin:2px 4px 2px 0}
.row{margin:8px 0;font-size:15px}
button{font-family:inherit;font-size:16px;border:0;border-radius:14px;padding:10px 16px;cursor:pointer;color:#fff;font-weight:700;box-shadow:0 4px 0 rgba(0,0,0,.15)}
button:active{transform:translateY(2px);box-shadow:0 2px 0 rgba(0,0,0,.15)}
.kill{background:var(--down)}.revive{background:var(--up)}.reset{background:#8c9eff}
.msg{margin-top:12px;padding:12px;border-radius:14px;background:var(--soft);font-size:15px;line-height:1.6}
.msg b.u{color:var(--up)}.msg b.d{color:var(--down)}
.pr{display:grid;grid-template-columns:90px 1fr 74px;gap:8px;align-items:center;padding:5px 6px;border-radius:12px;cursor:pointer;font-size:14px}
.pr:hover,.pr.sel{background:var(--soft)}
.bar{height:14px;border-radius:99px;background:var(--soft);overflow:hidden}
.bar i{display:block;height:100%;border-radius:99px;transition:width .5s,background .5s}
.st{font-size:13px;text-align:right}
.dl{stroke:#b08968;stroke-width:2.5;stroke-dasharray:6 6;opacity:0;transition:opacity .3s}
.dl.dg{opacity:.8}.dl.show{opacity:.95}
.chip{background:var(--soft);color:var(--ink);box-shadow:none;border:2px solid var(--line);padding:5px 10px;font-size:14px;border-radius:99px;margin:2px 0}
.chip.on{background:var(--hi);color:#fff;border-color:var(--hi)}
.frm input[type=text]{font-family:inherit;font-size:16px;padding:8px 12px;border-radius:12px;border:2px solid var(--line);background:var(--soft);color:var(--ink)}
.add{background:var(--up)}.pre{background:#ff9f68}
.graph svg{border-radius:18px}
.node .lbl{paint-order:stroke;stroke:var(--card);stroke-width:4px;stroke-linejoin:round}
:root{--sky1:#cdeeff;--sky2:#fff4dd;--hill1:#cdeec3;--hill2:#b3e4a8;--soil:#ecd7c0;--soil2:#dcc1a4;--water:#bde7f6;--cloud:#ffffff;--trunk:#c9a07a;--leaf:#a8dd9a;--edge:#8f8174}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--sky1:#2b3a55;--sky2:#4a4a63;--hill1:#3d5a4a;--hill2:#35503f;--soil:#5a4a3f;--soil2:#6b5a4d;--water:#3d6b86;--cloud:#6a6f87;--trunk:#7a5c46;--leaf:#4a7a55;--edge:#cfc3b5}}
:root[data-theme="dark"]{--sky1:#2b3a55;--sky2:#4a4a63;--hill1:#3d5a4a;--hill2:#35503f;--soil:#5a4a3f;--soil2:#6b5a4d;--water:#3d6b86;--cloud:#6a6f87;--trunk:#7a5c46;--leaf:#4a7a55;--edge:#cfc3b5}
</style>
</head>
<body>
<div class="wrap">
  <h1>🌿 먹이그물 탐험대</h1>
  <p class="lead">화살표는 “먹히는 생물 → 먹는 생물” 방향이에요. 생물을 눌러 보세요!</p>

  <div class="graph">
    <svg id="svg" viewBox="0 0 800 500" role="img" aria-label="먹이그물 그래프"></svg>
    <div class="legend">
      <span>🟧 선택한 먹이사슬</span><span style="color:var(--up)">▲ 늘어요</span>
      <span style="color:var(--down)">▼ 줄어요</span><span>⚪ 사라졌어요</span><span>🟫 점선: 분해자</span><span>🚨 외래종</span>
    </div>
  </div>

  <div class="grid">
    <div class="box" id="card"></div>
    <div class="box">
      <h2>📊 생물 수 (처음 = 100)</h2>
      <div id="pops"></div>
      <div style="margin-top:10px"><button class="reset" id="resetBtn">🔄 처음으로</button></div>
    </div>
  </div>
<div class="box" id="addBox" style="margin-top:14px"></div>
</div>

<script>
const SP = {
  grass:{n:'풀',e:'🌱',x:400,y:420,c:'#c4ecb5',role:'생산자',d:'햇빛으로 스스로 양분을 만들어요.'},
  rabbit:{n:'토끼',e:'🐰',x:120,y:290,c:'#ffd9e4',role:'1차 소비자',d:'풀을 먹는 귀여운 초식동물이에요.'},
  hopper:{n:'메뚜기',e:'🦗',x:310,y:290,c:'#e2f3b0',role:'1차 소비자',d:'풀잎을 사각사각 먹어요.'},
  mouse:{n:'쥐',e:'🐭',x:620,y:290,c:'#e6ddd3',role:'1차 소비자',d:'풀씨와 풀을 먹어요.'},
  frog:{n:'개구리',e:'🐸',x:230,y:165,c:'#b9efd2',role:'2차 소비자',d:'긴 혀로 메뚜기를 잡아먹어요.'},
  snake:{n:'뱀',e:'🐍',x:520,y:165,c:'#d9d3ff',role:'2차 소비자',d:'토끼, 개구리, 쥐를 먹어요.'},
  hawk:{n:'매',e:'🦅',x:400,y:50,c:'#ffe3b3',role:'최종 소비자',d:'하늘에서 토끼, 쥐, 뱀을 잡아요.'}
};
// [먹히는 것, 먹는 것]
let EDGES = [['grass','rabbit'],['grass','hopper'],['grass','mouse'],
  ['hopper','frog'],['frog','snake'],['rabbit','snake'],['mouse','snake'],
  ['rabbit','hawk'],['mouse','hawk'],['snake','hawk']];
SP.decomp = {n:'분해자',e:'🍄',x:710,y:420,c:'#ead9c8',role:'분해자',d:'죽은 생물, 낙엽, 똥을 분해해서 흙에 양분을 돌려줘요. 버섯, 곰팡이, 세균이 있어요.'};
let ids = Object.keys(SP); const R = 38;
const preyOf = id => EDGES.filter(e=>e[1]===id).map(e=>e[0]);
const predOf = id => EDGES.filter(e=>e[0]===id).map(e=>e[1]);
const batchim = s => { const c = s.charCodeAt(s.length-1)-0xAC00; return c>=0 && c%28!==0; };
const j = (n,a,b) => n + (batchim(n)?a:b);

let extinct = new Set(), pop = {}, selected = null, lastKilled = null;

function simulate(){
  ids.forEach(i => pop[i] = extinct.has(i) ? 0 : 100);
  for(let t=0;t<20;t++){
    const nx = {};
    ids.forEach(i=>{
      if(extinct.has(i)){ nx[i]=0; return; }
      const prey = preyOf(i), pred = predOf(i);
      if(i==='decomp'){ nx[i]=100; return; }
      let food = 1;
      if(!prey.length) food = 0.3+0.7*Math.min(1.2,pop.decomp/100);
      if(prey.length){
        food = prey.reduce((s,p)=>s+pop[p]/100,0)/prey.length;
        if(food < 0.08){ nx[i]=0; return; }
        food = Math.min(food,1.2);
      }
      let pf = 1;
      if(pred.length){
        const pm = pred.reduce((s,p)=>s+pop[p]*(SP[p].inv?2.2:1)/100,0)/pred.length;
        pf = Math.max(0.7, Math.min(1.4, 1 + 0.35*(1-pm)));
      }
      const grow = (SP[i].inv && !pred.length) ? 1.5 : 1;
      const target = Math.min(200, 100*food*pf*grow);
      nx[i] = Math.round(0.5*pop[i] + 0.5*target);
    });
    ids.forEach(i => pop[i] = nx[i]);
  }
}
function status(i){
  if(extinct.has(i)) return {k:'gone',t:'멸종했어요',col:'var(--gone)',ic:'✖'};
  if(pop[i]<=3) return {k:'gone',t:'굶어서 사라졌어요',col:'var(--gone)',ic:'✖'};
  if(pop[i]>=115) return {k:'up',t:'늘어요',col:'var(--up)',ic:'▲'};
  if(pop[i]<=85) return {k:'down',t:'줄어요',col:'var(--down)',ic:'▼'};
  return {k:'same',t:'그대로예요',col:'var(--line)',ic:''};
}
function reason(i){
  const s = status(i).k, out = [];
  if(i!=='decomp' && !preyOf(i).length && pop.decomp<85) out.push('분해자가 줄어서 양분이 모자라요');
  if(SP[i].inv && s==='up' && !predOf(i).length) out.push('천적이 없어서 빠르게 늘어요 🚨');
  if(s==='down'||s==='gone'){
    const lost = preyOf(i).filter(p=>pop[p]<85).map(p=>SP[p].n);
    if(lost.length) out.push('먹이인 '+j(lost.join(', '),'이','가')+' 줄었어요');
    const more = predOf(i).filter(p=>pop[p]>115).map(p=>SP[p].n);
    if(more.length) out.push('천적인 '+j(more.join(', '),'이','가')+' 늘었어요');
  } else if(s==='up'){
    const less = predOf(i).filter(p=>pop[p]<85).map(p=>SP[p].n);
    if(less.length) out.push('천적인 '+j(less.join(', '),'이','가')+' 줄었어요');
    const more = preyOf(i).filter(p=>pop[p]>115).map(p=>SP[p].n);
    if(more.length) out.push('먹이인 '+j(more.join(', '),'이','가')+' 늘었어요');
  }
  return out.join(' · ');
}

const svg = document.getElementById('svg');
function layout(){
  const cons = ids.filter(i=>i!=='decomp'), lv = {};
  cons.forEach(i=>lv[i]=0);
  for(let t=0;t<8;t++) cons.forEach(i=>{ const p=preyOf(i); if(p.length) lv[i]=Math.min(6,1+Math.max(...p.map(q=>lv[q]))); });
  const max = Math.max(1,...Object.values(lv)), gap = 360/max, done = {};
  for(let L=0;L<=max;L++){
    const row = cons.filter(i=>lv[i]===L);
    const bc = i=>{ const p=preyOf(i).filter(q=>done[q]); return p.length ? p.reduce((s,q)=>s+SP[q].x,0)/p.length : 400; };
    row.sort((a,b)=>bc(a)-bc(b));
    const w = L===0 ? [110,560] : [90,710];
    row.forEach((i,k)=>{ SP[i].x = row.length===1 ? (w[0]+w[1])/2 : w[0]+(w[1]-w[0])*k/(row.length-1); SP[i].y = 420-L*gap; done[i]=1; });
  }
}
function scene(){
  const tree = (x,y,s)=>`<g transform="translate(${x} ${y}) scale(${s})"><rect x="-6" y="0" width="12" height="46" rx="4" style="fill:var(--trunk)"/><circle cx="0" cy="-8" r="34" style="fill:var(--leaf)"/><circle cx="-22" cy="12" r="24" style="fill:var(--leaf)"/><circle cx="22" cy="12" r="24" style="fill:var(--leaf)"/></g>`;
  const cloud = (x,y,s)=>`<g transform="translate(${x} ${y}) scale(${s})" style="fill:var(--cloud)"><ellipse cx="0" cy="0" rx="34" ry="14"/><circle cx="-12" cy="-10" r="16"/><circle cx="12" cy="-12" r="19"/></g>`;
  const flower = (x,y,c)=>`<g transform="translate(${x} ${y})"><line x1="0" y1="0" x2="0" y2="14" stroke="#7bc47f" stroke-width="2"/><circle r="5" fill="${c}"/><circle r="2" fill="#fff6c9"/></g>`;
  return `<g pointer-events="none">
  <defs><linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" style="stop-color:var(--sky1)"/><stop offset=".75" style="stop-color:var(--sky2)"/></linearGradient></defs>
  <rect width="800" height="500" fill="url(#sky)"/>
  <circle cx="735" cy="62" r="42" fill="#ffe27a" opacity=".3"/><circle cx="735" cy="62" r="30" fill="#ffe27a"/>
  ${cloud(120,70,1)}${cloud(560,45,.8)}${cloud(300,115,.6)}
  <path d="M190 40q8-8 16 0M220 52q7-7 14 0" stroke="#8a8a9a" fill="none" stroke-width="2" opacity=".6"/>
  <path d="M0 330Q130 250 280 312T560 300T800 290V500H0Z" style="fill:var(--hill1)"/>
  <path d="M0 395Q200 350 400 385T800 370V500H0Z" style="fill:var(--hill2)"/>
  ${tree(36,265,.9)}${tree(772,262,.8)}
  <ellipse cx="130" cy="418" rx="78" ry="20" style="fill:var(--water)"/><ellipse cx="118" cy="414" rx="30" ry="6" fill="#fff" opacity=".45"/>
  ${flower(210,430,'#ff9ec0')}${flower(470,435,'#ffd36e')}${flower(560,425,'#ffffff')}${flower(40,405,'#c7a6ff')}
  <path d="M0 458Q200 446 400 458T800 452V500H0Z" style="fill:var(--soil)"/>
  <g style="fill:var(--soil2)"><circle cx="60" cy="480" r="5"/><circle cx="250" cy="487" r="4"/><circle cx="420" cy="478" r="6"/><circle cx="560" cy="489" r="4"/><circle cx="640" cy="476" r="5"/></g>
  </g>`;
}
function decompLines(){
  const D = SP.decomp; let h = '';
  ids.forEach(i=>{
    if(i==='decomp') return;
    const A=SP[i], dx=D.x-A.x, dy=D.y-A.y, L=Math.hypot(dx,dy), ux=dx/L, uy=dy/L;
    if(!preyOf(i).length) h += `<line class="dl dg" data-f="${i}" x1="${D.x-ux*(R+2)}" y1="${D.y-uy*(R+2)}" x2="${A.x+ux*(R+8)}" y2="${A.y+uy*(R+8)}" marker-end="url(#a3)"/>`;
    else h += `<line class="dl" data-f="${i}" x1="${A.x+ux*(R+2)}" y1="${A.y+uy*(R+2)}" x2="${D.x-ux*(R+8)}" y2="${D.y-uy*(R+8)}" marker-end="url(#a3)"/>`;
  });
  return h;
}
function decompHL(){
  document.querySelectorAll('.dl').forEach(l=>{
    const show = selected==='decomp' || l.dataset.f===selected;
    l.classList.toggle('show', show);
    l.style.opacity = st0('decomp') ? .12 : (l.classList.contains('dg') && selected && !show ? .15 : '');
  });
}
function buildSvg(){
  layout();
  let h = `<defs>
    <marker id="a1" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" style="fill:var(--edge)"/></marker>
    <marker id="a2" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#ff8a3d"/></marker>
  <marker id="a3" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#b08968"/></marker>
  </defs>${scene()}${decompLines()}`;
  EDGES.forEach(([a,b],k)=>{
    const A=SP[a],B=SP[b],dx=B.x-A.x,dy=B.y-A.y,L=Math.hypot(dx,dy),ux=dx/L,uy=dy/L;
    h += `<line class="edge" id="e${k}" x1="${A.x+ux*(R+2)}" y1="${A.y+uy*(R+2)}" x2="${B.x-ux*(R+8)}" y2="${B.y-uy*(R+8)}" marker-end="url(#a1)"/>`;
  });
  ids.forEach(i=>{
    const s=SP[i];
    h += `<g class="node" id="n_${i}" data-id="${i}">
      <circle class="body" cx="${s.x}" cy="${s.y}" r="${R}" fill="${s.c}" stroke="#fff"${s.inv?' stroke-dasharray="7 4"':''}/>
      <text class="emo" x="${s.x}" y="${s.y+2}">${s.e}</text>
      <text class="lbl" x="${s.x}" y="${s.y+R+20}">${s.inv?'🚨':''}${s.n}</text>
      <text class="badge" x="${s.x+R-4}" y="${s.y-R+10}"></text>
    </g>`;
  });
  svg.innerHTML = h;
  svg.querySelectorAll('.node').forEach(g=>g.addEventListener('click',()=>{selected=g.dataset.id;render();}));
}

function render(){
  const conn = new Set();
  if(selected==='decomp') ids.forEach(i=>conn.add(i));
  if(selected){ conn.add(selected); conn.add('decomp'); preyOf(selected).forEach(x=>conn.add(x)); predOf(selected).forEach(x=>conn.add(x)); }
  ids.forEach(i=>{
    const g = document.getElementById('n_'+i), st = status(i);
    g.classList.toggle('dim', !!selected && !conn.has(i));
    const c = g.querySelector('circle.body');
    c.setAttribute('stroke', i===selected ? '#ff8a3d' : (st.k==='same' ? '#fff' : st.col));
    c.style.fill = st.k==='gone' ? '#dcd8d3' : SP[i].c;
    g.querySelector('.emo').style.opacity = st.k==='gone' ? .35 : 1;
    const b = g.querySelector('.badge'); b.textContent = st.ic; b.style.fill = st.col;
  });
  EDGES.forEach(([a,b],k)=>{
    const e = document.getElementById('e'+k);
    const on = selected && (a===selected || b===selected);
    e.classList.toggle('on', !!on);
    e.classList.toggle('dead', st0(a)||st0(b));
    e.setAttribute('marker-end', on ? 'url(#a2)' : 'url(#a1)');
    e.style.opacity = selected && !on ? .15 : '';
  });
  decompHL(); renderCard(); renderPops();
}
const st0 = i => status(i).k==='gone';

function renderCard(){
  const el = document.getElementById('card');
  let html = '';
  if(!selected){
    html = `<h2>👆 생물을 눌러 보세요</h2><p class="row">위 그림에서 생물을 누르면 누구를 먹고, 누구에게 먹히는지 알려줄게요.</p>`;
  } else {
    const s = SP[selected], dead = extinct.has(selected), isD = selected==='decomp';
    const eats = preyOf(selected).map(p=>`<span class="pill">${SP[p].e} ${SP[p].n}</span>`).join('') || (isD?'<span class="pill">💀 죽은 생물·낙엽·똥</span>':'<span class="pill">없어요 (스스로 양분을 만들어요)</span>');
    const eaten = predOf(selected).map(p=>`<span class="pill">${SP[p].e} ${SP[p].n}</span>`).join('') || (isD?'<span class="pill">🌱 풀이 쓰는 양분이 돼요</span>':'<span class="pill">없어요 (맨 꼭대기!)</span>');
    html = `<div style="display:flex;gap:12px;align-items:center"><div class="big">${s.e}</div>
      <div><h2 style="margin:0">${s.n}</h2><span class="pill">${s.role}</span>${s.inv?'<span class="pill" style="background:#ffd0d0;color:#a33">🚨 외래종</span>':''}</div></div>
      <p class="row">${s.d}</p>
      <div class="row">🍽️ <b>먹는 것</b><br>${eats}</div>
      <div class="row">⚠️ <b>${isD?'하는 일':'나를 먹는 것'}</b><br>${eaten}</div>
      <button class="${dead?'revive':'kill'}" id="toggleBtn">${dead?'💚 되살리기':'💥 멸종시키기'}</button>${s.user?' <button class="reset" id="delBtn">🗑️ 지우기</button>':''}`;
  }
  if(lastKilled){
    const lines = [];
    ids.forEach(i=>{
      if(i===lastKilled.id) return;
      const st = status(i);
      if(st.k==='same') return;
      const cls = st.k==='up' ? 'u' : 'd';
      lines.push(`${SP[i].e} <b class="${cls}">${j(SP[i].n,'은','는')} ${st.t} ${st.ic}</b> <span style="color:var(--sub)">– ${reason(i)}</span>`);
    });
    const head = lastKilled.head ? lastKilled.head : lastKilled.revive
      ? `💚 ${j(SP[lastKilled.id].n,'이','가')} 다시 돌아왔어요!`
      : `😢 ${j(SP[lastKilled.id].n,'이','가')} 사라졌어요!`;
    html += `<div class="msg"><b>${head}</b><br>${lines.length ? lines.join('<br>') : '다른 생물에게는 큰 변화가 없어요.'}</div>`;
  }
  el.innerHTML = html;
  const db = document.getElementById('delBtn'); if(db) db.onclick = ()=>removeSp(selected);
  const tb = document.getElementById('toggleBtn');
  if(tb) tb.onclick = ()=>{
    const dead = extinct.has(selected);
    dead ? extinct.delete(selected) : extinct.add(selected);
    lastKilled = {id:selected, revive:dead};
    simulate(); render();
  };
}

function renderPops(){
  document.getElementById('pops').innerHTML = ids.map(i=>{
    const st = status(i), w = Math.min(100, pop[i]/2);
    const col = st.k==='same' ? '#9bd8e8' : st.col;
    return `<div class="pr ${i===selected?'sel':''}" data-id="${i}">
      <span>${SP[i].e} ${SP[i].n}</span>
      <div class="bar"><i style="width:${w}%;background:${col}"></i></div>
      <span class="st" style="color:${st.k==='same'?'var(--sub)':st.col}">${pop[i]} ${st.ic}</span></div>`;
  }).join('');
  document.querySelectorAll('.pr').forEach(r=>r.onclick=()=>{selected=r.dataset.id;render();});
}

document.getElementById('resetBtn').onclick = ()=>{ ids.filter(i=>SP[i].user).forEach(i=>delete SP[i]); ids = ids.filter(i=>SP[i]); EDGES = EDGES.filter(e=>SP[e[0]]&&SP[e[1]]);
  extinct.clear(); lastKilled=null; selected=null; simulate(); buildSvg(); render(); renderAdd(); };
const form = {n:'',e:'',kind:'animal',inv:false,prey:new Set(),pred:new Set()}; let uid = 0;
const PRESETS = {bull:{n:'황소개구리',e:'🐸',prey:['hopper','frog','mouse','snake']}, nut:{n:'뉴트리아',e:'🦫',prey:['grass']}};
const addBox = document.getElementById('addBox');
function renderAdd(){
  const opts = ids.filter(i=>i!=='decomp'), animal = form.kind==='animal';
  const chips = k => opts.map(i=>`<button type="button" class="chip ${form[k].has(i)?'on':''}" data-k="${k}" data-i="${i}">${SP[i].e} ${SP[i].n}</button>`).join(' ');
  const em = ['🦊','🐟','🦆','🐿️','🐛','🦉','🐦','🐻','🦌','🐢','🐊','🌾'].map(x=>`<button type="button" class="chip" data-em="${x}">${x}</button>`).join(' ');
  addBox.innerHTML = `<h2>➕ 새 생물 추가하기</h2>
  <p class="row" style="color:var(--sub);margin-top:0">우리 동네 생물이나 외래종을 직접 넣고, 먹이그물이 어떻게 바뀌는지 관찰해요!</p>
  <div class="frm row"><input type="text" id="fn" placeholder="이름 (예: 여우)" maxlength="8" size="12" value="${form.n}"> <input type="text" id="fe" placeholder="이모지" maxlength="4" size="5" value="${form.e}"></div>
  <div class="row">${em}</div>
  <div class="row"><button type="button" class="chip ${animal?'on':''}" data-kind="animal">🐾 동물(소비자)</button> <button type="button" class="chip ${animal?'':'on'}" data-kind="plant">🌿 식물(생산자)</button>
   ${animal?`<button type="button" class="chip ${form.inv?'on':''}" data-inv="1">🚨 외래종</button>`:''}</div>
  ${animal?`<div class="row">🍽️ <b>먹는 것</b> (1개 이상 골라요)<br>${chips('prey')}</div>`:''}
  <div class="row">⚠️ <b>이 생물을 먹는 것</b> (없어도 돼요)<br>${chips('pred')}</div>
  <div class="row"><button type="button" class="add" id="addBtn">✅ 추가하기</button> <button type="button" class="pre" data-pre="bull">🐸 황소개구리 예시</button> <button type="button" class="pre" data-pre="nut">🦫 뉴트리아 예시</button></div>
  <div class="row" id="fmsg" style="color:var(--down)"></div>`;
}
addBox.addEventListener('input', e=>{ if(e.target.id==='fn') form.n=e.target.value; if(e.target.id==='fe') form.e=e.target.value; });
addBox.addEventListener('click', e=>{
  const b = e.target.closest('button'); if(!b) return; const d = b.dataset;
  if(d.em){ form.e=d.em; document.getElementById('fe').value=d.em; return; }
  if(d.kind){ form.kind=d.kind; if(d.kind==='plant'){ form.prey.clear(); form.inv=false; } }
  else if(d.inv){ form.inv=!form.inv; }
  else if(d.k){ const s=form[d.k], o=form[d.k==='prey'?'pred':'prey']; if(s.has(d.i)) s.delete(d.i); else { s.add(d.i); o.delete(d.i); } }
  else if(d.pre){ const p=PRESETS[d.pre]; Object.assign(form,{n:p.n,e:p.e,kind:'animal',inv:true,prey:new Set(p.prey.filter(i=>SP[i])),pred:new Set()}); }
  else if(b.id==='addBtn'){ addSpecies(); return; }
  else return;
  renderAdd();
});
function addSpecies(){
  const n = form.n.trim(), msg = t=>{ document.getElementById('fmsg').textContent = t; };
  if(!n) return msg('이름을 적어 주세요!');
  if(ids.some(i=>SP[i].n===n)) return msg('이미 있는 이름이에요.');
  if(form.kind==='animal' && !form.prey.size) return msg('먹는 것을 한 가지 이상 골라 주세요!');
  const id = 'u'+(++uid), inv = form.kind==='animal' && form.inv;
  SP[id] = {n, e:form.e.trim()||'🐾', x:0, y:0, c:inv?'#ffd0d0':'#d7ecff', user:true, inv, role:form.kind==='plant'?'생산자':'소비자',
    d: inv ? '다른 곳에서 들어온 외래종이에요. 천적이 없으면 어떻게 될까요?' : '우리가 직접 추가한 생물이에요.'};
  ids.push(id);
  form.prey.forEach(p=>EDGES.push([p,id])); form.pred.forEach(q=>EDGES.push([id,q]));
  lastKilled = {id, head: inv ? `🚨 외래종 ${j(n,'이','가')} 들어왔어요!` : `🆕 ${j(n,'이','가')} 새로 등장했어요!`};
  Object.assign(form,{n:'',e:'',inv:false,prey:new Set(),pred:new Set()}); selected = id;
  simulate(); buildSvg(); render(); renderAdd();
}
function removeSp(id){
  const nm = SP[id].n; delete SP[id]; ids = ids.filter(i=>i!==id);
  EDGES = EDGES.filter(e=>e[0]!==id && e[1]!==id); extinct.delete(id);
  lastKilled = {id, head:`🗑️ ${j(nm,'을','를')} 지웠어요.`}; selected = null;
  simulate(); buildSvg(); render(); renderAdd();
}
simulate(); buildSvg(); render(); renderAdd();
</script>
</body>
</html>
